; DIVERSE Moodle: PHP settings for the cPanel server.
; cPanel > MultiPHP INI Editor > Editor Mode > choose the site's folder, paste these lines, Save.
; PHP version: 8.2 or 8.3 (cPanel > MultiPHP Manager). Guide: docs/CPANEL.md.

; Moodle 5 refuses to install or upgrade below 5000.
max_input_vars = 10000

memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Largest file a teacher can upload (course backups, videos). post_max_size must be at least as large.
upload_max_filesize = 256M
post_max_size = 256M

; Never show errors on pages; they go to the error log.
display_errors = Off
log_errors = On

; Opcache: compiled PHP stays in memory, pages load much faster. PHP reads these lines only from the
; server-wide settings: WHM > MultiPHP INI Editor (root access). In cPanel's editor they are ignored.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 32
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1
