# DIVERSE Moodle for local development. Guide: docker.md. The live site runs on cPanel (docs/CPANEL.md).
name: diverse

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Local development only: no binary log and no disk flush on every commit. Much faster, especially the
    # first-start import, which rebuilds ~500 tables; a crash can lose at most the last second of writes.
    command: ["--skip-log-bin", "--innodb-flush-log-at-trx-commit=2"]
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=moodlepass
    volumes:
      - mysql_data:/var/lib/mysql
      # Only on the very first start (empty database volume) MySQL imports the DIVERSE database dump.
      - ./database/moodle.sql:/docker-entrypoint-initdb.d/10-moodle.sql:ro
    healthcheck:
      # Over TCP: during the first-start import MySQL accepts no network connections, so the service only
      # becomes healthy once the dump is fully imported.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The first-start import can take several minutes; until then failed checks do not count.
      start_period: 15m
      start_interval: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  moodle:
    build: .
    restart: unless-stopped
    ports:
      - "${MOODLE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80,$$e,$$m,5); if($$s){fclose($$s);exit(0);} exit(1);'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    environment:
      - MOODLE_DB_TYPE=mysqli
      - MOODLE_DB_HOST=mysql
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASS=moodlepass
      - MOODLE_URL=${MOODLE_URL:-http://localhost:8080}
      - MOODLE_DATA=/var/www/moodledata
      - MOODLE_THEMEDESIGNERMODE=${MOODLE_THEMEDESIGNERMODE:-false}
      - PHP_OPCACHE_ENABLE=${PHP_OPCACHE_ENABLE:-1}
      - PHP_OPCACHE_REVALIDATE_FREQ=${PHP_OPCACHE_REVALIDATE_FREQ:-60}
      - MOODLE_AUTO_PURGE_CACHES=${MOODLE_AUTO_PURGE_CACHES:-false}
      - MOODLE_SSLPROXY=${MOODLE_SSLPROXY:-false}
      - MOODLE_REVERSEPROXY=${MOODLE_REVERSEPROXY:-false}
      - MOODLE_CACHE_REDIS_HOST=redis
      - MOODLE_CACHE_REDIS_PORT=6379
      - MOODLE_CACHE_REDIS_PREFIX=gt4t_
    volumes:
      - moodledata:/var/www/moodledata
    # The code is copied into the image (see Dockerfile), not bind-mounted: a bind mount is very slow on Windows.
    # `docker compose watch` (or `docker compose up --watch`) copies every file you change into the container.
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - .git/
            - node_modules/
            - .env
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: .docker/php.ini
        - action: rebuild
          path: docker-entrypoint-custom.sh
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - UPLOAD_LIMIT=100M
    depends_on:
      - mysql

  # Sunucu SSL (Nginx Reverse Proxy) yapılandırması. Local PC'de otomatik olarak çalışmaz.
  nginx:
    image: nginx:alpine
    profiles:
      - prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      moodle:
        condition: service_healthy

volumes:
  mysql_data:
  moodledata:
  redis_data:
