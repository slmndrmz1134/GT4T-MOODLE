events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Cache zone for Moodle dynamic JS/CSS (keyed by rev number in URL)
    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=moodlestatic:10m
                     max_size=500m inactive=7d use_temp_path=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    upstream moodle {
        server moodle:80;
    }

    upstream phpmyadmin {
        server phpmyadmin:80;
    }

    server {
        listen 80;
        server_name thinkhub.club;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name thinkhub.club;

        ssl_certificate /etc/letsencrypt/live/thinkhub.club/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thinkhub.club/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 100M;

        location /phpmyadmin/ {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://phpmyadmin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Long-cache static theme assets (after themedesignermode is OFF).
        location ~* ^/theme/.*\.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|gif|ico)$ {
            proxy_pass http://moodle;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800";
        }

        # Cache Moodle dynamic JS/CSS served via PHP (revision-based URLs)
        location ~* ^/(lib/javascript\.php|lib/requirejs\.php|theme/styles\.php|theme/yui_combo\.php) {
            proxy_pass http://moodle;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_cache moodlestatic;
            proxy_cache_key $scheme$host$uri$is_args$args;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800";
        }

        location / {
            proxy_pass http://moodle;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
        }
    }
}
